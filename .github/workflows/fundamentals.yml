name: 財務データ更新（週1回）

on:
  schedule:
    - cron: "0 1 * * 6"   # 毎週土曜 10:00 JST（連続増配の項目を追加）
  workflow_dispatch:
  push:
    paths: [".github/workflows/fundamentals.yml"]

permissions:
  contents: write

concurrency:
  group: morning-data
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - run: python -m kabu.fundamentals
      - name: 保存
        run: |
          git config user.name "kabu-shisan-test"
          git config user.email "kabu-shisan-test@users.noreply.github.com"
          git add data/fundamentals.csv
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "財務データ更新 $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
