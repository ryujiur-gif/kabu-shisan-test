name: 接続確認（一時）
on:
  push:
    paths: [".github/workflows/check-data.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - run: python -m kabu.briefing --today 2026-11-09 | head -40
      - run: python -c "from datetime import date; from kabu.prices import get_day_prices; print(get_day_prices(['7203','6758'], date(2026,11,6)))"
